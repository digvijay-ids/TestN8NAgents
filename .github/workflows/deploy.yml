name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify secrets present
        run: |
          check() { if [ -n "$2" ]; then echo "$1: set"; else echo "$1: MISSING"; fi; }
          check VITE_BACKEND_URL              "$VITE_BACKEND_URL"
          check VITE_API_BASE_URL             "$VITE_API_BASE_URL"
          check VITE_ATTORNEY_SEARCH_URL      "$VITE_ATTORNEY_SEARCH_URL"
          check VITE_USE_MOCK_ATTORNEY_API    "$VITE_USE_MOCK_ATTORNEY_API"
          check VITE_CLAIMS_WEBHOOK_URL       "$VITE_CLAIMS_WEBHOOK_URL"
          check VITE_N8N_WEBHOOK_URL          "$VITE_N8N_WEBHOOK_URL"
          check VITE_REQUEST_TIMEOUT          "$VITE_REQUEST_TIMEOUT"
          check VITE_ATTORNEY_REQUEST_TIMEOUT "$VITE_ATTORNEY_REQUEST_TIMEOUT"
        env:
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_ATTORNEY_SEARCH_URL: ${{ secrets.VITE_ATTORNEY_SEARCH_URL }}
          VITE_USE_MOCK_ATTORNEY_API: ${{ secrets.VITE_USE_MOCK_ATTORNEY_API }}
          VITE_CLAIMS_WEBHOOK_URL: ${{ secrets.VITE_CLAIMS_WEBHOOK_URL }}
          VITE_N8N_WEBHOOK_URL: ${{ secrets.VITE_N8N_WEBHOOK_URL }}
          VITE_REQUEST_TIMEOUT: ${{ secrets.VITE_REQUEST_TIMEOUT }}
          VITE_ATTORNEY_REQUEST_TIMEOUT: ${{ secrets.VITE_ATTORNEY_REQUEST_TIMEOUT }}

      - name: Build
        run: npm run build
        env:
          # patmimo-utilities backend base URL (auth + DocProcessing proxy).
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}
          # Optional override; defaults to ${VITE_BACKEND_URL}/api/DocProcessing.
          # If set as a secret it MUST point at the proxy, not the .NET service.
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_ATTORNEY_SEARCH_URL: ${{ secrets.VITE_ATTORNEY_SEARCH_URL }}
          VITE_USE_MOCK_ATTORNEY_API: ${{ secrets.VITE_USE_MOCK_ATTORNEY_API }}
          VITE_CLAIMS_WEBHOOK_URL: ${{ secrets.VITE_CLAIMS_WEBHOOK_URL }}
          VITE_N8N_WEBHOOK_URL: ${{ secrets.VITE_N8N_WEBHOOK_URL }}
          VITE_REQUEST_TIMEOUT: ${{ secrets.VITE_REQUEST_TIMEOUT }}
          VITE_ATTORNEY_REQUEST_TIMEOUT: ${{ secrets.VITE_ATTORNEY_REQUEST_TIMEOUT }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
